<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FASE RUNTUH</title>
    <style>
        @font-face {
            font-family: Playfair;
            src: url(font/PlayfairDisplay-VariableFont_wght.ttf) format('truetype');
            font-display: swap;
            font-weight: normal;
            font-style: normal;
        }
        h1{
            color: rgb(0, 0, 0);
            font-family: 'Playfair'sans-serif;
            text-decoration: underline;
            text-decoration-style: wavy;
            text-decoration-color:rgb(125, 126, 124) ;
            text-align: center;
            text-shadow: 3px 2px 3px rgb(125, 123, 121);
        }
        p{
            line-height: 45px;
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
            font-size: 20px;
            word-spacing: 20px;
            padding: 25px;
        }
        cite{
            display: block;
            text-align: center;
        }
        span{
            text-decoration: line-through;
            text-decoration-color: brown;
            color: brown;
        }
    </style>
  </head>
  <body>
    <h1>FASE RUNTUH</h1>
    <blockquote>
      <p>
        "Tak perlu khawatir, ku hanya <span>terluka.</span <br> Terbiasa tuk pura-pura
        tertawa. <br> Namun bolehkah sekali saja ku menangis? <br> Sebelum kembali
        membohongi diri."
      </p>
      <cite>– feby putri feat. fiersa besari</cite>
    </blockquote>
  </body>
</html>
