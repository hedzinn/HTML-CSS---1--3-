<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar form</title>
</head>
<body>
    <h1>Form</h1>
    <form>
        <h1>Input:text</h1>
        <label for="name">Name :</label><br>
        <input type="text" name="text" id="text"><br>
        <h1>input:password</h1>
        <label for="Password">Password :</label><br>
        <input type="password" name="password" id="password"><br>
        <h1>Input:checkbox</h1>
        <input type="checkbox" name="hobi_1" id="hobi" value="Membaca"><label for="Membaca">Membaca</label><br>
        <input type="checkbox" name="hobi_2" id="hobi" value="Coding"><label for="Coding">Coding</label><br>
        <input type="checkbox" name="hobi_3" id="hobi" value="Olahraga"><label for="Olahraga">Olahraga</label><br>
        <h1>input:radio</h1>
        <input type="radio" name="Gender" id="laki-laki" value="laki-laki"><label for="Gender">Laki-Laki</label>
        <input type="radio" name="Gender" id="perempuan" value="perempuan"><label for="Gender">Perempuan</label><br>
        <h1>input:slect</h1>
        <select>
            <option value="Nama_Kota">-Kota Asal-</option>
            <option value="Kalimantan">Kalimantan</option>
            <option value="Jawa">Jawa</option>
            <option value="Solo">Solo</option>
            <option value="Banjar">Banjar</option>
            <option value="Balikpapan">Balikpapan</option>
            <option value="DKIJakarta">Jakarta</option>
            <option value="DIYJogja">Jogja</option>
        </select>
        <h1>Textarea</h1>
        <textarea name="text" id="text" placeholder="wajib diisi" rows="10" cols="30"></textarea>
        <h1>Input:submit</h1>
        <input type="submit" value="Kirim">
    </form>
</body>
</html>
