<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar form</title>
</head>
<body>
    <h1>Form</h1>
    <table border="1" cellspacing="0" cellpading="8">
        <form>
        <tr>
            <td align="right"><label for="name">Name :</label></td>
            <td colspan="2"><input type="text" name="text" id="text"></td>
        </tr>
        <tr>
            <td align="right"><label for="Password">Password :</label></td>
            <td colspan="2"><input type="password" name="password" id="password"></td>
        </tr>
        <tr>
            <td><input type="checkbox" name="hobi_1" id="hobi" value="Membaca"><label for="Membaca">Membaca</label></td>
            <td><input type="checkbox" name="hobi_2" id="hobi" value="Coding"><label for="Coding">Coding</label></td>
            <td><input type="checkbox" name="hobi_3" id="hobi" value="Olahraga"><label for="Olahraga">Olahraga</label></td>
        </tr>
        <tr>
            <td><h5>Jenis kelamin :</h5></td>
            <td align="center"><input type="radio" name="Gender" id="laki-laki" value="laki-laki"><label for="Gender">Laki-Laki</label></td>
            <td align="center" colspan="2"><input type="radio" name="Gender" id="perempuan" value="perempuan"><label for="Gender">Perempuan</label></td>
        </tr>
        <tr>
            <td align="center" colspan="3"><select>
            <option value="Nama_Kota">-Kota Asal-</option>
            <option value="Kalimantan">Kalimantan</option>
            <option value="Jawa">Jawa</option>
            <option value="Solo">Solo</option>
            <option value="Banjar">Banjar</option>
            <option value="Balikpapan">Balikpapan</option>
            <option value="DKIJakarta">Jakarta</option>
            <option value="DIYJogja">Jogja</option>
        </select></td>
        </tr>
        <tr>
            <td colspan="3"><textarea name="text" id="text" placeholder="wajib diisi" rows="10" cols="30"></textarea></td>
            
        </tr>
        <tr>
            <td align="center" colspan="3"><input type="submit" value="Kirim"></td>
        </tr>
        </form>
    </table>
</body>
</html>
